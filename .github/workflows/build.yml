name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QuietCamera/**'
      - 'QuietCamera.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: camera-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Standard hosted macOS is free for public repositories.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build unsigned IPA for SideStore
        run: bash scripts/build_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuietCamera-IPA
          path: |
            build/QuietCamera-v*.ipa
            build/QuietCamera-v*.ipa.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish verified IPA when its version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import plistlib; print("v" + plistlib.load(open("QuietCamera/Info.plist", "rb"))["CFBundleShortVersionString"])')
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IPA="QuietCamera-${VERSION}.ipa"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Keep the published binary and old links; add a versioned download of those exact bytes.
            if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "$IPA"; then
              echo "Versioned download already exists."
              exit 0
            fi
            gh release download "$VERSION" --pattern QuietCamera.ipa --pattern QuietCamera.ipa.sha256 --dir legacy
            (cd legacy && sed 's|build/QuietCamera.ipa|QuietCamera.ipa|' QuietCamera.ipa.sha256 | sha256sum --check)
            mv legacy/QuietCamera.ipa "legacy/$IPA"
            (cd legacy && sha256sum "$IPA" > "$IPA.sha256")
            gh release upload "$VERSION" "legacy/$IPA" "legacy/$IPA.sha256"
            exit 0
          fi
          gh run download "$BUILD_RUN" --name QuietCamera-IPA --dir release
          (cd release && sha256sum --check "$IPA.sha256")
          python3 scripts/verify_ipa.py "release/$IPA"
          printf '%s\n' \
            'Adds left-edge back navigation and horizontal paging through captured photos. Zoomed photos pan within the image; restore fit size to resume paging. Deletion preserves a neighboring photo selection.' \
            '' \
            'Capture supports add-only access; gallery viewing and deletion require selected/all photo access. History starts with v1.3.0 captures; older photos remain in Photos. Update the existing app to retain history.' \
            '' \
            "Install $IPA using SideStore. The IPA is unsigned; SideStore signs it." \
            '' \
            'Saved photos are center-cropped to match the full-screen preview. Front-camera mirroring is preserved.' \
            'Wide lens remains 1x. Ultra-wide minimum zoom is usually 0.5x; unsupported/front cameras retain their actual minimum. Up to 8x displayed zoom within device limits.' \
            'iOS 16 or later. Portrait and both landscape orientations. Camera sound, rotation, focus, permissions and real-device layout still require testing on your iPhone.' > notes.txt
          gh release create "$VERSION" "release/$IPA" "release/$IPA.sha256" \
            --target "$BUILD_COMMIT" --title "Quiet Camera $VERSION" --notes-file notes.txt
