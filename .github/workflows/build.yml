name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QuietCamera/**'
      - 'QuietCamera.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: camera-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Standard hosted macOS is free for public repositories.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build unsigned IPA for SideStore
        run: bash scripts/build_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuietCamera-IPA
          path: |
            build/QuietCamera.ipa
            build/QuietCamera.ipa.sha256
          if-no-files-found: error
          retention-days: 3
